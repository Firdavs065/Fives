<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIVES - Bozor</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f6f8}
header{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 8px rgba(0,0,0,.08)}
.top{display:flex;align-items:center;gap:10px;padding:12px;max-width:1100px;margin:auto}
.logo{font-size:24px;font-weight:900;letter-spacing:3px;color:#0a7cff}
.logo span{color:#ff6b00}
.search{flex:1;display:flex;background:#f0f2f5;border-radius:10px;overflow:hidden}
.search input{flex:1;border:none;background:none;padding:11px;outline:none}
.search button{border:none;background:#0a7cff;color:#fff;padding:0 16px;font-weight:bold}
.langs{display:flex;gap:5px}
.langs button{padding:7px 10px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer}
.langs button.active{background:#111;color:#fff}
.add-btn{background:#ff6b00;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:bold;cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:14px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.cats button{white-space:nowrap;padding:9px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer}
.cats button.active{background:#0a7cff;color:#fff;border-color:#0a7cff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:11px}
.card-body h3{font-size:14px;line-height:1.3;height:36px;overflow:hidden}
.price{color:#0a7cff;font-weight:900;font-size:16px;margin-top:6px}
.meta{font-size:12px;color:#888;margin-top:4px}
.actions{display:flex;gap:6px;margin-top:9px}
.actions button{flex:1;padding:8px;border-radius:8px;border:1px solid #eee;background:#f8f8f8;cursor:pointer}
.actions button.liked{color:red;border-color:red}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;padding:16px;overflow:auto}
.modal-box{background:#fff;max-width:600px;margin:30px auto;border-radius:16px;padding:18px}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:11px;margin:7px 0;border:1px solid #ddd;border-radius:10px}
.modal-box button{width:100%;padding:12px;background:#0a7cff;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:8px}
.close{float:right;font-size:22px;cursor:pointer}
.comments{margin-top:12px;background:#f8f8f8;padding:10px;border-radius:10px}
.comments div{font-size:13px;padding:5px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<header>
<div class="top">
<div class="logo">FIVES<span>.TJ</span></div>
<div class="search"><input id="searchInput" placeholder="Qidiruv..."><button onclick="doSearch()">🔍</button></div>
<div class="langs">
<button onclick="setLang('uz',this)" class="active">UZ</button>
<button onclick="setLang('ru',this)">RU</button>
<button onclick="setLang('tj',this)">TJ</button>
</div>
<button class="add-btn" onclick="openAdd()">+ Elon</button>
</div>
</header>

<div class="wrap">
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
</div>

<!-- ELON KO'RISH -->
<div class="modal" id="viewModal">
<div class="modal-box">
<span class="close" onclick="closeModal('viewModal')">×</span>
<div id="viewContent"></div>
</div>
</div>

<!-- ELON QO'SHISH -->
<div class="modal" id="addModal">
<div class="modal-box">
<span class="close" onclick="closeModal('addModal')">×</span>
<h3 id="addTitle">Elon berish</h3>
<select id="f-cat"><option value="phone">📱 Telefon</option><option value="tech">🔌 Maishiy texnika</option><option value="comp">💻 Kompyuter</option></select>
<input id="f-title" placeholder="Nomi: iPhone 13 Pro">
<input id="f-price" placeholder="Narxi: 4500000">
<input id="f-img" placeholder="Rasm linki (https://...)">
<input id="f-city" placeholder="Shahar: Xo'jand">
<input id="f-phone" placeholder="Telefon: +992 92...">
<textarea id="f-desc" placeholder="Tavsif..."></textarea>
<button onclick="addListing()">Elonni joylash</button>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
